<article>
  <h2>Nix mode</h2>


  <textarea id="nixCode">
# Autogenerated, please don't edit by hand
{ system ? builtins.currentSystem }:

let
  bootstrap = import (/home/tom/tools/nixpkgs) { inherit system; };
  codedownPinned = import (bootstrap.fetchFromGitHub {
    owner = "codedownio";
    repo = "codedown-languages";
    rev = "bbafdd51f4e1b0b8869cae7d492fb0b8ac9586f5"; # codedown-languages-rev
    hash = "sha256-s7xUTR9JJTblFtqC3bWaWJ6WZA84U9jnJtafbYE7Q94="; # codedown-languages-hash
  })  { inherit system; inherit (bootstrap) fetchFromGitHub; };

  overlays = [codedownPinned.nixpkgsOverlay];
  importedChannels = builtins.mapAttrs (name: value: let imported = import value; in
    if (builtins.isFunction imported && builtins.hasAttr "overlays" (builtins.functionArgs imported)) then imported { inherit overlays system; }
    else if (builtins.isFunction imported) then imported { inherit system; inherit (bootstrap) fetchFromGitHub; }
    else imported
  ) channels;

  multiLineString = ''
    Line 1
    Line 2
  '';

  number = 42.3;

in

# importedChannels.channel0.packageSearch

importedChannels
  </textarea>

  <script>
   var nixEditor = CodeMirror.fromTextArea(document.getElementById('nixCode'), {
     mode: 'text/x-nix',
     lineNumbers: true,
     matchBrackets: true
   });
  </script>

  <p><strong>MIME types defined:</strong> <code>text/x-nix</code> (Nix).</p>
