  <h2>Typst mode</h2>

  <textarea id="typstCode">
= Introduction

This is a *Typst* document demonstrating _various_ syntax features.

// This is a line comment
/* This is a
   block comment */

== Code Examples

#let name = "World"
#let greeting = "Hello " + name

#if true {
  [The greeting is: #greeting]
}

#for i in range(3) {
  [Item #(i + 1)]
}

== Math Mode

The quadratic formula is $ x = (-b plus.minus sqrt(b^2 - 4a c)) / (2a) $.

For display math:
$ sum_(i=1)^n i = (n(n+1))/2 $

== Lists and Formatting

- First item
- Second item
  - Nested item
  - Another nested item

+ Numbered list
+ Second numbered item

== Raw Text and Code

Here's some `inline code` and a code block:

```rust
fn main() {
    println!("Hello, world!");
}
```

== Functions and Variables

#let square(x) = x * x
#let result = square(5)

The result is #result.

== Advanced Features

#import "template.typ": *
#include "content.typ"

#let data = (
  name: "Alice",
  age: 30,
  city: "New York"
)

#for (key, value) in data {
  [#key: #value]
}
